    <div class="backdrop is-hidden" data-modal>
      <div class="model">
        <button class="model__button" type="button" data-modal-close><svg class="model__icon">
          <use href="./img/symbol-defs.svg#icon-cross"></use>
      </svg></button>
      <h2 class="model__title">Залиште свої дані, ми вам передзвонимо</h2>
      <form class="model__form">
          <label class="model__label">ім'я
            <input class="model__input" type="text" required minlength="2" maxlength="15"/>
            <svg class="model__pic">
              <use href="./img/symbol-defs.svg#icon-user"></use>
            </svg>
          </label>
          
          <label class="model__label">телефон
            <input class="model__input" type="tel" pattern="^\+38\s0\d{2}\s\d{3}\s\d{2}\s\d{2}$" placeholder="+38 123 456 78 90"/>
            <svg class="model__pic">
              <use href="./img/symbol-defs.svg#icon-phone"></use>
            </svg>
          </label>

          <label class="model__label">пошта
            <input class="model__input" type="email" required minlength="10"/>
            <svg class="model__pic">
              <use href="./img/symbol-defs.svg#icon-box-add"></use>
            </svg>
          </label>
          <label class="model__label">коментар
            <textarea placeholder="Введіть текст" class="model__comment">
            </textarea>
          </label>
          <div class="model__box">
            <input class="model__check" type="checkbox" required>
            <p class="model__text">Погоджуюся з розсилкою та приймаю</p>
            <a class="model__link" href="">Умови договору</a>
          </div>
          <button class="model__submit" type="submit">Відправити</button>
      </form>
      </div>
    </div>
    <script type="module" src="./modal.js"></script>
